[pytest]
# ESP-IDF names embedded test files pytest_*.py, not the pytest default test_*.py
python_files = pytest_*.py

# pytest-repeat (shipped in the IDF python env) and pytest-embedded both define
# --count; disable the former so the plugins don't collide at startup.
addopts = -p no:repeat

# pytest-embedded's dut fixture uses pytest's experimental record_xml_attribute
# (its code, not ours) -- silence the notice, keep other warnings visible.
filterwarnings =
    ignore:record_xml_attribute is an experimental feature
